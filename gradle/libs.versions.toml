[versions]
asciidoctorj = "2.5.13"
jetty = "12.1.14"
junit = "5.7.1"
junit-platform = "1.7.1"
logback = "1.5.18"

[libraries]
asciidoctorj-git-link = { module = "fr.jmini.asciidoctorj:git-link", version = "3.2.2" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.11.1" }
gson = { module = "com.google.code.gson:gson", version = "2.8.5" }
jetty-ee9-nested = { module = "org.eclipse.jetty.ee9:jetty-ee9-nested", version.ref = "jetty" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-migrationsupport = { module = "org.junit.jupiter:junit-jupiter-migrationsupport", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
picocli = { module = "info.picocli:picocli", version = "3.5.2" }
reactive-streams = { module = "org.reactivestreams:reactive-streams", version = "1.0.2" }
rxjava = { module = "io.reactivex.rxjava3:rxjava", version = "3.1.6" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }

[plugins]
asciidoctor-convert = { id = "org.asciidoctor.jvm.convert", version = "4.0.5" }
git-publish = { id = "org.ajoberstar.git-publish", version = "5.1.3" }
jreleaser = { id = "org.jreleaser", version = "1.26.0" }
release = { id = "net.researchgate.release", version = "3.2.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
